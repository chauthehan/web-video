    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      margin-top: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: #6e7681;
    }

    @media (max-width: 600px) {
